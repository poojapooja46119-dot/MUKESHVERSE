
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUKESHVERSE - Page 6</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
    background:
      linear-gradient(rgba(2,5,25,.65), rgba(2,5,25,.8)),
      url("https://images.unsplash.com/photo-1462331940025-496dfbfc7564?w=1920") center/cover no-repeat;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(white 1px, transparent 1px),
      radial-gradient(#9ccaff 1px, transparent 1px);
    background-size: 90px 90px, 140px 140px;
    animation: move 35s linear infinite;
}

@keyframes move {
    from { transform: translateY(0); }
    to { transform: translateY(-150px); }
}

.container {
    position: relative;
    z-index: 2;
    width: 90%;
    max-width: 750px;
    padding: 35px 20px;
}

.small {
    color: #c6baff;
    letter-spacing: 5px;
    font-size: 13px;
    margin-bottom: 35px;
}

h1 {
    font-size: clamp(30px, 6vw, 55px);
    line-height: 1.3;
    text-shadow: 0 0 25px #9c7bff;
    margin-bottom: 25px;
}

.message {
    font-size: clamp(18px, 3vw, 25px);
    line-height: 1.8;
    color: #eee8ff;
    margin-bottom: 35px;
}

button {
    border: 1px solid #d7c5ff;
    background: linear-gradient(135deg, #7956d9, #bd66c9);
    color: white;
    padding: 15px 32px;
    border-radius: 35px;
    font-size: 17px;
    cursor: pointer;
    box-shadow: 0 0 25px #9b72ff88;
    transition: .3s;
}

button:hover {
    transform: scale(1.08);
    box-shadow: 0 0 35px #c58aff;
}

.hidden {
    display: none;
}

#reveal {
    animation: pop .7s ease;
}

@keyframes pop {
    0% { transform: scale(.2); opacity: 0; }
    80% { transform: scale(1.1); }
    100% { transform: scale(1); opacity: 1; }
}

.fool {
    font-size: clamp(40px, 9vw, 85px);
    color: #ffcb6b;
    text-shadow: 0 0 25px #ff8a00;
    margin: 20px 0;
}

.emoji {
    font-size: 55px;
    margin: 20px 0;
}

.next-btn {
    margin-top: 25px;
    background: linear-gradient(135deg, #392a86, #7956d9);
}
</style>
</head>

<body>

<div class="stars"></div>

<div class="container">

    <div class="small">MUKESHVERSE • PAGE 6</div>

    <div id="first">
        <h1>Mukeshhhh... 😌</h1>

        <div class="message">
            Unakku oru mukkiyamaana vishayam sollanum... 👀<br>
            Konjam serious-ah kelu!
        </div>

        <button onclick="showSecond()">Enna vishayam? 👀</button>
    </div>

    <div id="second" class="hidden">
        <h1>Ready-ah? 😂</h1>

        <div class="message">
            Naan unakku oru surprise vechiruken...<br>
            Click pannu paapom! 🤭
        </div>

        <button onclick="showReveal()">Open Surprise 🎁</button>
    </div>

    <div id="reveal" class="hidden">
        <div class="emoji">🤣🤣🤣</div>

        <div class="fool">APRIL FOOL!</div>

        <h1>😂😂😂</h1>

        <div class="message">
            Unna summa prank pannitten da! 😂❤️<br>
            Kovapadatha... just for fun! 😜
        </div>

        <button class="next-btn" onclick="goNext()">
            NEXT SURPRISE →
        </button>
    </div>

</div>

<script>
function showSecond() {
    document.getElementById("first").classList.add("hidden");
    document.getElementById("second").classList.remove("hidden");
}

function showReveal() {
    document.getElementById("second").classList.add("hidden");
    document.getElementById("reveal").classList.remove("hidden");
}

function goNext() {
    window.location.href = "page7.html";
}
</script>

</body>
</html>
