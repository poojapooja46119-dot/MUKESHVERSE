
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUKESHVERSE | Page 2</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
    color: white;
    background: #02030b;
}

/* REAL GALAXY BACKGROUND */
.universe {
    position: fixed;
    inset: 0;
    background:
        linear-gradient(rgba(1,3,15,.35), rgba(1,2,12,.65)),
        url("https://images.unsplash.com/photo-1462331940025-496dfbfc7564?auto=format&fit=crop&w=2400&q=90");
    background-size: cover;
    background-position: center;
    animation: galaxyZoom 35s ease-in-out infinite alternate;
}

@keyframes galaxyZoom {
    from { transform: scale(1); }
    to { transform: scale(1.15); }
}

/* DARK OVERLAY */
.overlay {
    position: fixed;
    inset: 0;
    background: radial-gradient(
        circle,
        transparent 10%,
        rgba(0,0,15,.25) 55%,
        rgba(0,0,0,.65) 100%
    );
}

/* STARS */
#stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
}

.star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    box-shadow: 0 0 8px white;
    animation: twinkle 3s infinite ease-in-out;
}

@keyframes twinkle {
    0%,100% { opacity: .2; transform: scale(.7); }
    50% { opacity: 1; transform: scale(1.5); }
}

/* SHOOTING STAR */
.shooting-star {
    position: fixed;
    width: 130px;
    height: 2px;
    background: linear-gradient(90deg, white, transparent);
    transform: rotate(-35deg);
    top: 20%;
    left: -150px;
    animation: shoot 6s linear infinite;
    filter: drop-shadow(0 0 5px white);
}

@keyframes shoot {
    0% { left: -150px; top: 15%; opacity: 0; }
    10% { opacity: 1; }
    35% { left: 110%; top: 65%; opacity: 0; }
    100% { left: 110%; opacity: 0; }
}

/* CONTENT */
.content {
    position: relative;
    z-index: 5;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 25px;
    animation: appear 2s ease forwards;
}

@keyframes appear {
    from { opacity: 0; transform: translateY(25px); }
    to { opacity: 1; transform: translateY(0); }
}

.small-text {
    font-size: 11px;
    letter-spacing: 7px;
    color: #c6c8ff;
    margin-bottom: 35px;
    text-transform: uppercase;
}

.message {
    font-size: clamp(25px, 5vw, 48px);
    font-weight: 300;
    line-height: 1.6;
    letter-spacing: 1px;
    text-shadow: 0 0 25px rgba(190,180,255,.65);
}

.message span {
    display: block;
    font-size: clamp(18px, 3vw, 25px);
    margin-top: 18px;
    color: #e4ddff;
    font-weight: 400;
}

.line {
    width: 65px;
    height: 2px;
    background: #c7b5ff;
    box-shadow: 0 0 15px #a98aff;
    margin: 35px 0;
}

.next-btn {
    padding: 14px 38px;
    border: 1px solid rgba(255,255,255,.65);
    border-radius: 40px;
    background: rgba(255,255,255,.08);
    color: white;
    font-size: 11px;
    letter-spacing: 4px;
    cursor: pointer;
    backdrop-filter: blur(12px);
    transition: .4s;
}

.next-btn:hover {
    background: white;
    color: #080817;
    box-shadow: 0 0 30px rgba(200,180,255,.7);
    transform: translateY(-4px);
}

.footer {
    position: absolute;
    bottom: 25px;
    font-size: 10px;
    letter-spacing: 5px;
    color: rgba(255,255,255,.55);
}

@media(max-width:600px) {
    .small-text { letter-spacing: 4px; }
    .message { line-height: 1.5; }
}
</style>
</head>

<body>

<div class="universe"></div>
<div class="overlay"></div>
<div id="stars"></div>
<div class="shooting-star"></div>

<main class="content">

    <div class="small-text">M U K E S H V E R S E</div>

    <div class="message">
        Next enna irukunu paakalam…
        <span>
            Aana romba expect pannidatha<br>
            simple ahh tha irukum 😂❤️
        </span>
    </div>

    <div class="line"></div>

    <button class="next-btn" onclick="goNext()">
        CONTINUE →
    </button>

    <div class="footer">A LITTLE SURPRISE FOR YOU</div>

</main>

<script>
const stars = document.getElementById("stars");

for (let i = 0; i < 180; i++) {
    const star = document.createElement("div");
    star.className = "star";

    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";
    star.style.animationDelay = Math.random() * 4 + "s";
    star.style.animationDuration = (2 + Math.random() * 4) + "s";

    stars.appendChild(star);
}

function goNext() {
    window.location.href = "page3.html";
}
</script>

</body>
</html>
