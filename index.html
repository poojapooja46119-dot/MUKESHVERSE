
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUKESHVERSE | Birthday Surprise</title>
    <link rel="stylesheet" href="style.css">
    
</head>

<body>

    <main class="welcome-screen">

        <!-- Galaxy background -->
        <div class="galaxy-background"></div>
        <div class="background-overlay"></div>

        <!-- Animated stars -->
        <div class="stars" id="stars"></div>

        <!-- Floating planets -->
        <div class="planet planet-one"></div>
        <div class="planet planet-two"></div>

        <!-- Main welcome content -->
        <section class="welcome-content">

            <p class="top-label">
                ✦ A LITTLE UNIVERSE MADE FOR YOU ✦
            </p>

            <h1>
                Happiest<br>
                <span>Birthdayyy</span>
            </h1>

            <h2>My Special One! ❤️</h2>

            <p class="welcome-message">
                Innaiku unakku oru special day…
                so, unakkaga oru small surprise! 🥳
            </p>

            <button class="explore-button" id="exploreBtn">
                LET'S EXPLORE
                <span>→</span>
            </button>

            <p class="bottom-caption">
                MADE WITH FRIENDSHIP & MEMORIES
            </p>

        </section>

        <div class="scroll-indicator">
            <span></span>
        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
